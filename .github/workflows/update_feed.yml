name: Update Pinterest Feed

on:
  schedule:
    - cron: '0 3 * * *' # Запуск каждый день в 03:00 ночи
  workflow_dispatch: # Позволяет запустить вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run conversion script
        run: python convert.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add pinterest_feed.xml
          git commit -m "Auto-update Pinterest Feed" || echo "No changes to commit"
          git push
